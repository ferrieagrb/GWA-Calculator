<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEU-C GWA Calculator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap');

        /* --- BRANDED PORTAL HEADER STYLES --- */
        .portal-header {
            background-color: #008444; /* Match the vibrant FEU green from the image */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px 20px;
            color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-family: "Poppins", sans-serif;
        }
        .logo-text {
            font-weight: 500;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* --- THE DYNAMIC LAYOUT ENGINE --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Fluid global envelope preventing side breakages */
        .main-wrapper {
            flex: 1;
            width: 100%;
            max-width: 660px; /* Controlled expansion ceiling */
            margin: 0 auto;
            padding: 0 16px;
            box-sizing: border-box;
        }
        
        .page-title-container {
            margin: 30px 0 10px 0;
        }
        .page-title-container h1 {
            font-size: 2rem;
            color: #1a252f;
            margin: 0;
            font-weight: 400;
            font-family: "Poppins", sans-serif;
        }

        /* Dynamic Container Architecture */
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            font-family: "Roboto", sans-serif;
            width: 100%;
            box-sizing: border-box; /* Crucial: ensures padding doesn't widen block past 100% */
            margin: 15px 0 40px 0;
        }
        .scale-info {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        /* Flexible Rows: wrap automatically when screen boundaries collapse */
        .row {
            display: flex;
            flex-wrap: wrap; 
            gap: 12px;
            margin-bottom: 20px;
            align-items: flex-end; /* Locks button cleanly baseline to baseline with inputs */
        }
        
        .input-group {
            flex: 2 1 200px; /* Grows to fill space, falls back gracefully if space constraints hits */
            display: flex;
            flex-direction: column;
        }
        .input-group.size-grade {
            flex: 1 1 90px;
        }
        .input-group.size-units {
            flex: 1 1 80px;
        }

        label {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 6px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        input {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            width: 100%;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3498db;
            outline: none;
        }

        /* --- BUTTONS & CONTROLS --- */
        button {
            cursor: pointer;
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-add {
            background-color: #3498db;
            color: white;
            width: 100%;
            margin-bottom: 15px;
            font-size: 1rem;
        }
        .btn-add:hover { background-color: #2980b9; }
        
        .btn-remove {
            background-color: #e74c3c;
            color: white;
            height: 41px; /* Uniform standard alignment baseline height */
            padding: 0 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-remove:hover { background-color: #c0392b; }
        
        .btn-calc {
            background-color: #008444; /* Standardized to match core branded identity */
            color: white;
            width: 100%;
            font-size: 1.1rem;
            padding: 14px;
        }
        .btn-calc:hover { background-color: #006b36; }
        
        .result-box {
            margin-top: 25px;
            padding: 18px;
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: #1e293b;
        }

        /* --- FOOTER LAYOUT & INTERACTIONS --- */
        .site-footer {
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 25px 20px;
            text-align: center;
            font-family: Arial, sans-serif;
            width: 100%;
            box-sizing: border-box;
        }
        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }
        .footer-credits {
            font-size: 0.9rem;
            color: #4a5568;
            margin: 0 0 12px 0;
        }
        .footer-credits strong {
            color: #008444; 
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 12px;
        }
        .social-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #f1f5f9;
            color: #4a5568;
            transition: all 0.2s ease-in-out;
            text-decoration: none;
        }
        .social-icon:hover {
            transform: translateY(-3px);
            color: #ffffff;
        }
        .icon-fb:hover { background-color: #1877F2; }
        .icon-mail:hover { background-color: #EA4335; }
        .icon-behance:hover { background-color: #0057ff; }
        .icon-github:hover { background-color: #24292e; }

        .social-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .footer-version {
            font-size: 0.75rem;
            color: #a0aec0;
            margin: 0;
        }

        /*
